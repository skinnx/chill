# Mossling Meadow CI (synthesis D14; report 03 §7; docs/QA.md §1).
# Every gate lives in tools/ci/run_ci.sh so a local run reproduces CI exactly; this file only
# provisions the machine. Godot and the export templates are the official 4.7.2-stable builds,
# verified against pinned hashes (tools/ci/install_godot.sh SHA-512, tools/ci/fetch_templates.py
# SHA-256 per member + zip CRC). Actions are pinned to commit SHAs (tag in the comment).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: lint + data gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tools/ci/requirements.txt
      - run: pip install -r tools/ci/requirements.txt
      - name: gdlint, content, colour rules, fonts, economy, metrics self-test
        run: tools/ci/run_ci.sh lint data

  test:
    name: import, strict, GUT, smoke, audio, visual
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tools/ci/requirements.txt
      - run: pip install -r tools/ci/requirements.txt
      - name: Xvfb, Mesa llvmpipe (GLES 3.2), ImageMagick
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends xvfb xauth libgl1-mesa-dri libegl1 libegl-mesa0 \
            libgles2 libxcursor1 libxinerama1 libxrandr2 libxi6 libxkbcommon0 libfontconfig1 imagemagick
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/godot
          key: godot-editor-${{ env.GODOT_VERSION }}-${{ hashFiles('tools/ci/install_godot.sh') }}
      - name: Godot ${{ env.GODOT_VERSION }} (official, SHA-512 verified)
        run: tools/ci/install_godot.sh ~/godot
      - name: Gates
        run: tools/ci/run_ci.sh import strict test smoke audio visual
      - name: Upload reports, JUnit and snapshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reports-and-snapshots
          path: |
            reports/
            qa/out/
          if-no-files-found: warn
          retention-days: 14

  export:
    name: export Web + Android debug APK, Web boot smoke
    needs: [lint, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Godot 4.7 builds Android against Java 17 (platform/android/java/app/config.gradle). The
      # runner's ANDROID_HOME already has build-tools 36.1.0 (apksigner) and platform-tools.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "17"
      # Web smoke (tools/qa/web): puppeteer-core + the npm-packaged Chromium, pinned by package-lock.json.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/qa/web/package-lock.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/godot
          key: godot-editor-${{ env.GODOT_VERSION }}-${{ hashFiles('tools/ci/install_godot.sh') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-templates-${{ env.GODOT_VERSION }}-${{ hashFiles('tools/ci/fetch_templates.py') }}
      - name: Godot ${{ env.GODOT_VERSION }} (official, SHA-512 verified)
        run: tools/ci/install_godot.sh ~/godot
      - name: Export templates (ranged fetch of 4 members, SHA-256 pinned)
        run: python3 -I tools/ci/fetch_templates.py
      - name: Debug keystore (throw-away, per run)
        run: |
          keytool -genkeypair -keyalg RSA -keysize 2048 -validity 10000 -alias androiddebugkey \
            -keypass android -storepass android -keystore "$RUNNER_TEMP/debug.keystore" \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Import, export, Web boot smoke
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          export PATH="$ANDROID_HOME/build-tools/36.1.0:$PATH"
          tools/ci/run_ci.sh import export web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-nothreads
          path: build/web/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-debug-apk
          path: build/android/
          if-no-files-found: error
          retention-days: 30
      - name: Export logs and Web smoke report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: export-logs
          path: |
            reports/
            qa/out/web/
          if-no-files-found: warn
          retention-days: 14
